# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [12.x]

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
      env:
        TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        SECRET: ${{ secrets.SECRET }}
        JWT_EXPIRATION: 10000
        EMAIL_USER: ---
        GOOGLE_CLIENT_ID: 616250925098-e3vfflufc0eec1137nmjpie91ue27k05ig.apps.googleusercontent.com
        GOOGLE_CLIENT_SECRET: mBBWJGRFUNu5hMeejMj9Do29G8
        FB_CLIENT_ID: 2444690765e807653
        FB_CLIENT_SECRET: e6b96b529039e58f5f563e5bff37e1f61
        DIALECT: mysql
        TRENDING_WATCH_COUNT: 0
        ADMIN_USER: ${{ secrets.ADMIN_USER }}
        ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        SMTP_HOST: smtp.sendgrid.net
        SMTP_PORT: 587
        SENDGRID_USER: ${{ secrets.SENDGRID_USER }}
        SENDGRID_PASS: ${{ secrets.SENDGRID_PASS}}
        HOST: https://cinetie.herokuapp.com
        MIN_CASHOUT: 0
        CA_LOCATION: ca-certificate.crt
        PAY_HOST: https://cinetie-payment.herokuapp.com
        NODE_ENV: test
    - run: npm ci
    - run: echo $SECRET
    - run: echo $NODE_ENV
    - run: npm run build --if-present
    - run: npm test
