name: Cinetie Test
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    # Service containers to run with `container-job`
    strategy:
      fail-fast: true
      matrix:
        redis-version: [6] 
    services:
      # Label used to access the service container
      mysql-master:
        image: mysql:5.7
        ports:
          - 3306/tcp
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: cinetie_test
          MYSQL_PASSWORD: 1234
          MYSQL_USER: cinetie_user

        options: >-
          --name=mysql-master
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3    
    env:
      TEST_DATABASE_URL: mysql://cinetie_user:1234@127.0.0.1:49153/cinetie_test
      SECRET: ${{ secrets.SECRET }}
      JWT_EXPIRATION: 10000
      EMAIL_USER: app146030787@heroku.com
      GOOGLE_CLIENT_ID: 616250925098-e3vfflufc0c1137nmjpie91ue27k05ig.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: mBBWJGRFUNu5hMjMj9Do29G8
      FB_CLIENT_ID: 2444690765807653
      FB_CLIENT_SECRET: e6b96b52903958f5f563e5bff37e1f61
      DIALECT: mysql
      TRENDING_WATCH_COUNT: 0
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: 587
      SENDGRID_USER: ${{ secrets.SENDGRID_USER }}
